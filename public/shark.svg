<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t">
<title id="t">Deep sea: a shark bites through the network cable</title>
<!-- PHP Station error art (black & silver). Self-contained: no scripts, no external files. CSS animations only,
     switched off for prefers-reduced-motion. -->
<defs>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b1e23"/>
    <stop offset=".55" stop-color="#0c0e11"/>
    <stop offset="1" stop-color="#050607"/>
  </linearGradient>
  <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e6e8ec" stop-opacity=".16"/>
    <stop offset="1" stop-color="#e6e8ec" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="skin" x1="0" y1="-1" x2="0" y2="1">
    <stop offset="0" stop-color="#f4f5f7"/>
    <stop offset=".35" stop-color="#c5c9d0"/>
    <stop offset=".62" stop-color="#7d828b"/>
    <stop offset="1" stop-color="#3a3e45"/>
  </linearGradient>
  <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9dce1"/>
    <stop offset="1" stop-color="#6b7079"/>
  </linearGradient>
  <linearGradient id="cable" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6d727b"/>
    <stop offset=".45" stop-color="#2c3036"/>
    <stop offset="1" stop-color="#15171a"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
    <stop offset=".35" stop-color="#e6e8ec" stop-opacity=".35"/>
    <stop offset="1" stop-color="#e6e8ec" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" cx=".5" cy=".45" r=".75">
    <stop offset=".6" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".55"/>
  </radialGradient>
</defs>
<style>
  .ray { animation: ray 7s ease-in-out infinite; }
  .ray.b { animation-delay: -2.5s; }
  .ray.c { animation-delay: -4.5s; }
  @keyframes ray { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .bub { fill: none; stroke: #e6e8ec; stroke-opacity: .45; stroke-width: 1.2; animation: rise 6s linear infinite; }
  .bub.b { animation-duration: 7.5s; animation-delay: -2s; }
  .bub.c { animation-duration: 5s; animation-delay: -3.5s; }
  .bub.d { animation-duration: 8s; animation-delay: -1s; }
  .bub.e { animation-duration: 6.5s; animation-delay: -5s; }
  @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(8px, -230px); opacity: 0; } }

  .weed { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4.5s ease-in-out infinite; }
  .weed.b { animation-delay: -1.5s; animation-duration: 5.5s; }
  .weed.c { animation-delay: -3s; }
  @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

  .shark { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-3px, -5px); } }
  .tail { transform-box: fill-box; transform-origin: 100% 50%; animation: tail 1.1s ease-in-out infinite; }
  @keyframes tail { 0%, 100% { transform: skewY(-7deg); } 50% { transform: skewY(7deg); } }
  .jaw { animation: bite 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 0; }
  @keyframes bite { 0%, 60%, 100% { transform: rotate(0); } 75% { transform: rotate(7deg); } }

  .pulse { fill: #f4f5f7; offset-path: path('M -10 262 C 120 282 260 256 396 268'); animation: travel 2.8s linear infinite; }
  .pulse.b { animation-delay: -.95s; }
  .pulse.c { animation-delay: -1.9s; }
  @keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }

  .spark { stroke: #ffffff; stroke-width: 2; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: spark .9s steps(2, end) infinite; }
  .spark.b { animation-delay: -.3s; }
  .spark.c { animation-delay: -.6s; }
  @keyframes spark { 0% { opacity: 1; transform: scale(1); } 50% { opacity: .15; transform: scale(.6); } 100% { opacity: 1; transform: scale(1.1); } }
  .glow { animation: glow 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes glow { 0%, 100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pulse { display: none; } }
</style>

<!-- sea and light from the surface -->
<rect width="640" height="360" fill="url(#sea)"/>
<polygon class="ray" points="150,0 210,0 300,360 170,360" fill="url(#ray)"/>
<polygon class="ray b" points="330,0 370,0 470,360 360,360" fill="url(#ray)"/>
<polygon class="ray c" points="480,0 515,0 610,360 520,360" fill="url(#ray)"/>

<!-- far-away silhouettes -->
<g fill="#16181c">
  <path d="M0 250 C 60 236 120 248 180 240 C 260 230 300 246 360 238 C 430 228 520 244 640 232 L640 300 L0 300 Z"/>
</g>

<!-- sea grass -->
<g fill="none" stroke="#2b2f35" stroke-width="3" stroke-linecap="round">
  <path class="weed" d="M60 304 C 52 280 66 262 58 236"/>
  <path class="weed b" d="M74 306 C 82 286 70 270 80 250"/>
  <path class="weed c" d="M560 302 C 552 282 566 266 556 244"/>
  <path class="weed" d="M576 304 C 584 290 572 276 582 258"/>
  <path class="weed b" d="M250 306 C 244 292 256 282 250 268"/>
</g>

<!-- the cable: cut where the shark bites -->
<g stroke-linecap="round" fill="none">
  <path d="M -10 262 C 120 282 260 256 396 268" stroke="url(#cable)" stroke-width="13"/>
  <path d="M -10 260 C 120 280 260 254 396 266" stroke="#9a9fa8" stroke-opacity=".55" stroke-width="2"/>
  <path d="M 438 268 C 520 278 580 256 650 262" stroke="url(#cable)" stroke-width="13"/>
  <path d="M 438 266 C 520 276 580 254 650 260" stroke="#9a9fa8" stroke-opacity=".3" stroke-width="2"/>
  <!-- frayed wires -->
  <g stroke="#c5c9d0" stroke-width="1.6">
    <path d="M396 266 l 9 -8"/><path d="M397 268 l 11 1"/><path d="M396 271 l 8 8"/>
    <path d="M438 266 l -9 -7"/><path d="M437 269 l -10 2"/><path d="M438 272 l -7 8"/>
  </g>
</g>
<circle class="pulse" r="3"/>
<circle class="pulse b" r="3"/>
<circle class="pulse c" r="3"/>

<!-- sparks at both cut ends -->
<circle class="glow" cx="404" cy="268" r="20" fill="url(#glow)"/>
<circle class="glow" cx="430" cy="269" r="16" fill="url(#glow)"/>
<g>
  <path class="spark" d="M406 252 l 4 -10 M412 262 l 10 -4 M410 276 l 9 6"/>
  <path class="spark b" d="M428 252 l -3 -11 M422 262 l -10 -5 M424 280 l -6 9"/>
  <path class="spark c" d="M398 254 l -5 -8 M434 258 l 7 -9"/>
</g>

<!-- the shark, nose down at the cable -->
<g class="shark">
  <g transform="translate(232 206) rotate(12)">
    <path class="tail" d="M -48 -12 L -112 -50 Q -104 -18 -98 0 Q -104 20 -114 38 L -48 14 Z" fill="url(#fin)"/>
    <path d="M -38 -22 L -50 -40 L -50 -16 Z" fill="url(#fin)"/>
    <path d="M -34 20 L -46 34 L -48 16 Z" fill="url(#fin)"/>
    <path d="M 74 -28 C 58 -52 42 -70 18 -86 C 30 -62 28 -44 22 -27 Z" fill="url(#fin)"/>
    <path d="M 200 8 C 182 -14 124 -31 62 -31 C 18 -31 -22 -24 -62 -8 L -62 10 C -22 25 40 31 100 27 C 146 24 178 22 200 8 Z" fill="url(#skin)"/>
    <!-- lower jaw, biting -->
    <g class="jaw">
      <path d="M 194 14 C 176 30 150 34 126 28 C 150 24 174 22 194 14 Z" fill="#5b6068"/>
    </g>
    <path d="M 196 12 C 178 22 154 24 132 22" fill="none" stroke="#1a1c20" stroke-width="2.4" stroke-linecap="round"/>
    <g fill="#f4f5f7">
      <path d="M 150 22 l 3 5 l 3 -5 Z"/><path d="M 160 21 l 3 5 l 3 -5 Z"/><path d="M 170 19 l 3 5 l 3 -5 Z"/><path d="M 180 17 l 2.5 4.5 l 2.5 -4.5 Z"/>
    </g>
    <path d="M 102 20 C 86 42 62 60 34 70 C 56 50 70 36 76 24 Z" fill="url(#fin)"/>
    <g fill="none" stroke="#4a4f57" stroke-width="1.6" stroke-linecap="round">
      <path d="M 122 -12 q -5 12 0 24"/><path d="M 114 -13 q -5 12 0 25"/><path d="M 106 -14 q -5 12 0 26"/>
    </g>
    <circle cx="166" cy="-3" r="4" fill="#0b0c0e"/>
    <circle cx="167.4" cy="-4.4" r="1.2" fill="#ffffff"/>
  </g>
</g>

<!-- bubbles -->
<g>
  <circle class="bub" cx="438" cy="250" r="3"/>
  <circle class="bub b" cx="452" cy="240" r="2"/>
  <circle class="bub c" cx="120" cy="300" r="2.5"/>
  <circle class="bub d" cx="520" cy="300" r="4"/>
  <circle class="bub e" cx="300" cy="310" r="2"/>
</g>

<!-- seabed -->
<path d="M0 300 C 100 290 200 310 320 298 C 440 287 540 306 640 296 L640 360 L0 360 Z" fill="#08090b"/>
<g fill="#121418">
  <ellipse cx="150" cy="304" rx="26" ry="8"/>
  <ellipse cx="500" cy="300" rx="20" ry="7"/>
  <ellipse cx="610" cy="304" rx="14" ry="5"/>
</g>
<rect width="640" height="360" fill="url(#vignette)"/>
</svg>
