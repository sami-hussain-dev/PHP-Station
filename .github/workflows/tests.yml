name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    env:
      DEVPANEL_NO_SHORTCUTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.js -Path server.js, lib, public, tests | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
      # The integration and DB tests need a real PHP / MariaDB on the machine: run them locally with `npm test`.
      - name: Unit, installer, wizard and safety tests (no servers, no network)
        run: node --test tests/unit.test.js tests/features.test.js tests/inbox.test.js tests/installer.test.js tests/wizard.test.js tests/safety.test.js
